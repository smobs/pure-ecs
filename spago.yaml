workspace:
  packageSet:
    registry: 56.4.0
  backend:
    # Invoke via npx so a bare `spago build` resolves the locally-installed
    # purs-backend-es (node_modules/.bin). Spawning the bare name fails with
    # ENOENT outside an `npm run` context, which puts node_modules/.bin on PATH.
    cmd: npx
    args:
      - purs-backend-es
      - build

package:
  name: pure-ecs
  dependencies:
    - arrays
    - console
    - effect
    - either
    - foreign
    - foreign-object
    - lists
    - maybe
    - node-fs
    - ordered-collections
    - partial
    - prelude
    - record
    - transformers
    - tuples
    - typelevel-prelude
  test:
    main: Test.Main
    dependencies:
      - spec
